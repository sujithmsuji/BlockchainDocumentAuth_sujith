<!DOCTYPE html>
<html>

<head>

    <title>Upload Successful</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">
    <div class="container-fluid bg-dark text-white p-3 mb-4">
    <div class="text-center">
        <h2>Blockchain Document Authentication System</h2>
        <p class="mb-0">Using SHA-256 Hashing & QR Code</p>
        <small>Mini Project - 2026</small>
    </div>
</div>

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-8">

<div class="card shadow">

<div class="card-header bg-success text-white">

<h3>✅ Document Uploaded Successfully</h3>

</div>

<div class="card-body">

<p><strong>Filename:</strong> {{ filename }}</p>

<p><strong>SHA-256 Hash</strong></p>

<textarea class="form-control" rows="5" readonly>{{ document_hash }}</textarea>

<br>

<h4>QR Code</h4>

<img src="{{ qr_image }}" width="250">

<br><br>

<a href="{{ qr_image }}" download class="btn btn-primary btn-lg">
⬇ Download QR Code
</a>

<a href="/dashboard" class="btn btn-secondary btn-lg">
Back to Dashboard
</a>

</div>

</div>

</div>

</div>

</div>

<footer class="text-center mt-5 mb-3">
    <hr>
    <p>
        Developed by <strong>Sujith M</strong><br>
        Mini Project - 2026
    </p>
</footer>

</body>

</html>
