<!DOCTYPE html>
<html>

<head>

    <title>Verify Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">
    <div class="container-fluid bg-dark text-white p-3 mb-4">
    <div class="text-center">
        <h2>Blockchain Document Authentication System</h2>
        <p class="mb-0">Using SHA-256 Hashing & QR Code</p>
        <small>Mini Project - 2026</small>
    </div>
</div>

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-6">

<div class="card shadow-lg border-0 rounded-4">

<div class="card-header bg-warning text-dark">

<h3>Verify Document</h3>

</div>

<div class="card-body">

<form method="POST" enctype="multipart/form-data">

<div class="mb-3">

<label class="form-label">
Select Document
</label>

<input
type="file"
name="document"
class="form-control"
required>

</div>

<div class="d-grid">

<button
type="submit"
class="btn btn-warning btn-lg">

Verify Document

</button>

</div>

</form>

<hr>

<a
href="/dashboard"
class="btn btn-secondary">

Back to Dashboard

</a>

</div>

</div>

</div>

</div>

</div>

<footer class="text-center mt-5 mb-3">
    <hr>
    <p>
        Developed by <strong>Sujith M</strong><br>
        Mini Project - 2026
    </p>
</footer>

</body>

</html>
