<!DOCTYPE html>
<html>

<head>

    <title>Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container-fluid bg-dark text-white p-3 mb-4">
    <div class="text-center">
        <h2>🔐 Blockchain Document Authentication System</h2>
        <p class="mb-0">Using SHA-256 Hashing & QR Code</p>
        <small>Mini Project - 2026</small>
    </div>
</div>

<div class="container">

<div class="row justify-content-center">

<div class="col-md-6">

<div class="card shadow-lg border-0 rounded-4">

<div class="card-header bg-success text-white text-center">

<h3>Create Account</h3>

</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">

<label class="form-label">Full Name</label>

<input
type="text"
name="fullname"
class="form-control"
placeholder="Enter your full name"
required>

</div>

<div class="mb-3">

<label class="form-label">Email Address</label>

<input
type="email"
name="email"
class="form-control"
placeholder="Enter your email"
required>

</div>

<div class="mb-3">

<label class="form-label">Password</label>

<input
type="password"
name="password"
class="form-control"
placeholder="Create a password"
required>

</div>

<div class="d-grid">

<button
type="submit"
class="btn btn-success btn-lg">

Register

</button>

</div>

</form>

<hr>

<p class="text-center">

Already have an account?

</p>

<div class="d-grid">

<a
href="/login"
class="btn btn-primary btn-lg">

Login Here

</a>

</div>

</div>

</div>

</div>

</div>

</div>

<footer class="text-center mt-5 mb-3">
<hr>
<p>
Developed by <strong>Sujith M</strong><br>
Mini Project - 2026
</p>
</footer>

</body>

</html>
